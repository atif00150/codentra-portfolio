<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 50">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <text x="10" y="33" font-family="'Segoe UI', 'Arial Black', Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff" letter-spacing="3" filter="url(#glow)">CODENTRA</text>
  <text x="12" y="46" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#7bc74a" letter-spacing="6">ELECTRONICS</text>
</svg>
